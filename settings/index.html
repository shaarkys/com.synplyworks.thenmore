<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <style>
      .timer-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }

      .timer-table th,
      .timer-table td {
        padding: 0.6rem;
        border-bottom: 1px solid var(--homey-color-line, #ddd);
        text-align: left;
        vertical-align: top;
      }

      .timer-table th {
        font-weight: 600;
      }

      .timer-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .timer-actions-cell {
        min-width: 9rem;
      }

      .timer-table-wrapper {
        overflow-x: auto;
      }

      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .section-heading .homey-title {
        margin-bottom: 0;
      }

      .timer-filters {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(10rem, 1fr);
        gap: 1rem;
        margin-top: 1rem;
      }

      .timer-filter-group {
        min-width: 0;
        margin-bottom: 0;
      }

      .timer-status {
        font-weight: 600;
      }

      .timer-meta {
        color: var(--homey-color-text-light, #666);
        font-size: 0.9em;
      }

      .timer-details-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: rgba(0, 0, 0, 0.55);
      }

      .timer-details-dialog {
        width: min(32rem, 100%);
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        padding: 1rem;
        border-radius: var(--homey-border-radius-default, 0.75rem);
        background: var(--homey-color-component, #fff);
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.35);
      }

      .timer-details-header {
        position: sticky;
        top: -1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin: -1rem -1rem 0.5rem;
        padding: 1rem;
        background: var(--homey-color-component, #fff);
      }

      .timer-details-header .homey-title {
        margin: 0;
      }

      .timer-details {
        margin: 0;
      }

      .timer-details dt {
        margin-top: 0.5rem;
        font-weight: 600;
      }

      .timer-details dd {
        margin-left: 0;
      }

      .is-hidden {
        display: none;
      }

      @media (max-width: 520px) {
        .timer-filters {
          grid-template-columns: 1fr;
          gap: 0.5rem;
        }

        .timer-table-wrapper {
          overflow: visible;
        }

        .timer-table,
        .timer-table tbody,
        .timer-table tr,
        .timer-table td {
          display: block;
          width: 100%;
        }

        .timer-table thead {
          display: none;
        }

        .timer-table tr {
          box-sizing: border-box;
          margin-bottom: 0.75rem;
          padding: 0.5rem;
          border: 1px solid var(--homey-color-line, #ddd);
          border-radius: var(--homey-border-radius-default, 0.75rem);
        }

        .timer-table td {
          box-sizing: border-box;
          display: grid;
          grid-template-columns: minmax(7rem, 42%) minmax(0, 1fr);
          gap: 0.5rem;
          padding: 0.4rem;
          border: 0;
        }

        .timer-table td::before {
          content: attr(data-label);
          font-weight: 600;
        }

        .timer-table .timer-actions-cell {
          display: block;
          min-width: 0;
          padding-top: 0.6rem;
        }

        .timer-table .timer-actions-cell::before {
          display: none;
        }

        .timer-actions {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
          width: 100%;
        }

        .timer-actions button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="homey-header">
      <h1 class="homey-title" id="page-title"></h1>
      <p class="homey-subtitle" id="page-subtitle"></p>
    </header>

    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" id="debug-title"></legend>
      <div class="homey-form-group">
        <label class="homey-form-checkbox">
          <input class="homey-form-checkbox-input" id="timeline-debug-enabled" type="checkbox">
          <span class="homey-form-checkbox-checkmark"></span>
          <span class="homey-form-checkbox-text" id="debug-label"></span>
        </label>
        <p class="homey-form-hint" id="debug-hint"></p>
      </div>
      <button type="button" id="save-settings" class="homey-button-primary-full"></button>
    </fieldset>

    <section>
      <div class="section-heading">
        <h2 class="homey-title" id="activity-title"></h2>
        <button type="button" id="clear-activity" class="homey-button-secondary-shadow"></button>
      </div>
      <p class="homey-form-hint" id="activity-hint"></p>
      <div class="timer-filters" id="activity-filters">
        <div class="timer-filter-group">
          <label class="homey-form-label" id="activity-search-label" for="activity-search"></label>
          <input class="homey-form-input" id="activity-search" type="search" autocomplete="off" aria-labelledby="activity-search-label">
        </div>
        <div class="timer-filter-group">
          <label class="homey-form-label" id="activity-status-filter-label" for="activity-status-filter"></label>
          <select class="homey-form-select" id="activity-status-filter" aria-labelledby="activity-status-filter-label">
            <option id="activity-status-all" value="all"></option>
            <option id="activity-status-running" value="running"></option>
            <option id="activity-status-stopped" value="stopped"></option>
          </select>
        </div>
      </div>
      <p id="activity-empty"></p>
      <p id="activity-no-results" class="is-hidden"></p>
      <div class="timer-table-wrapper">
        <table class="timer-table" id="activity-table">
          <thead>
            <tr>
              <th id="activity-device-heading"></th>
              <th id="activity-status-heading"></th>
              <th id="activity-time-heading"></th>
              <th id="activity-invocations-heading"></th>
              <th id="activity-action-heading"></th>
            </tr>
          </thead>
          <tbody id="activity-body"></tbody>
        </table>
      </div>
    </section>

    <div class="timer-details-overlay is-hidden" id="timer-details-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="details-title">
      <div class="timer-details-dialog">
        <div class="timer-details-header">
          <h2 class="homey-title" id="details-title"></h2>
          <button type="button" id="close-details" class="homey-button-secondary-shadow"></button>
        </div>
        <dl class="timer-details" id="timer-details">
          <dt id="detail-device-id-label"></dt>
          <dd id="detail-device-id"></dd>
          <dt id="detail-device-name-label"></dt>
          <dd id="detail-device-name"></dd>
          <dt id="detail-capability-label"></dt>
          <dd id="detail-capability"></dd>
          <dt id="detail-value-label"></dt>
          <dd id="detail-value"></dd>
          <dt id="detail-old-value-label"></dt>
          <dd id="detail-old-value"></dd>
          <dt id="detail-status-label"></dt>
          <dd id="detail-status"></dd>
          <dt id="detail-last-change-label"></dt>
          <dd id="detail-last-change"></dd>
          <dt id="detail-invocations-label"></dt>
          <dd id="detail-invocations"></dd>
          <dt id="detail-duration-label"></dt>
          <dd id="detail-duration"></dd>
          <dt id="detail-message-label"></dt>
          <dd id="detail-message"></dd>
        </dl>
      </div>
    </div>
    <script type="text/javascript" src="timerController.js"></script>
  </body>
</html>
